name: Build stocks.json

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set A–Z letter on stocks
        continue-on-error: true   # never block the stocks.json build
        env:
          WEBFLOW_WRITE_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}   # same secret; token needs CMS read + write
          COLLECTION_ID: 694a72b4bc39c8103c7fd5b1
          AZ_COLLECTION_ID: 6af04bdb3248edbb382544f5
        run: node set-letters.mjs
      - name: Build JSON from Webflow CMS
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
          COLLECTION_ID: 694a72b4bc39c8103c7fd5b1
          AR_LOCALE_ID: 6903b27139b715029178a147
        run: node build-stocks.mjs
      - name: Commit if changed
        run: |
          git config user.name "stocks-bot"
          git config user.email "stocks-bot@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update stocks.json"
          git pull --rebase origin main
          git push
      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist/stocks.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist/stocks-ar.json" || true
